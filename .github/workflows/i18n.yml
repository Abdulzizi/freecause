name: i18n parity

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lang-parity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      - name: Run lang parity audit
        run: php scripts/lang-audit.php

  crowdin-upload:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.CROWDIN_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload sources to Crowdin
        uses: crowdin/github-action@v2
        with:
          config: crowdin.yml
          upload_sources: true
          upload_translations: false
          download_translations: false
        env:
          CROWDIN_PROJECT_ID: '936363'
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}

  crowdin-download:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Download translations from Crowdin
        run: npx --yes @crowdin/cli@5 download translations
        env:
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}

      - name: Format translations
        run: ./vendor/bin/pint lang

      - name: Validate lang files
        run: php scripts/lang-audit.php

      - name: Open pull request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: l10n_crowdin
          base: main
          title: 'chore(i18n): new Crowdin translations'
          commit-message: 'chore(i18n): new Crowdin translations'
          delete-branch: true
          body: |
            Automated Crowdin translation sync.

            - `pint lang` applied
            - `scripts/lang-audit.php` passed
