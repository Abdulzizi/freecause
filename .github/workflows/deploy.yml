name: Deploy

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Tag or branch to deploy (blank = current ref)'
        required: false
        default: ''
      action:
        description: 'Action'
        type: choice
        options:
          - deploy
          - rollback
        default: deploy

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  ci:
    if: ${{ github.event_name == 'push' || inputs.action == 'deploy' }}
    uses: ./.github/workflows/ci.yml

  security-audit:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-scripts

      - name: Composer audit
        run: composer audit --locked

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Npm audit
        run: npm ci --no-audit --no-fund && npm audit --audit-level=high

  deploy:
    needs: [ci]
    if: ${{ always() && (needs.ci.result == 'success' || needs.ci.result == 'skipped') }}
    environment: production
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install JS dependencies
        run: npm ci --no-audit --no-fund

      - name: Build frontend assets
        if: ${{ github.event_name == 'push' || inputs.action != 'rollback' }}
        run: npm run build

      - name: Install Deployer
        run: |
          curl -fsSL -o deployer.phar https://github.com/deployphp/deployer/releases/download/v8.0.5/deployer.phar
          chmod +x deployer.phar
          sudo mv deployer.phar /usr/local/bin/dep

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf 'Host *\n  StrictHostKeyChecking accept-new\n  IdentityFile ~/.ssh/id_deploy\n' > ~/.ssh/config

      - name: Deploy
        if: ${{ github.event_name == 'push' || inputs.action != 'rollback' }}
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST || '37.60.254.112' }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER || 'root' }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/var/www/freecause' }}
          TAG: ${{ inputs.ref || github.ref_name }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "push" ] || [ -n "${{ inputs.ref }}" ]; then
            dep -f deploy/deploy.php deploy production --tag="$TAG" --no-interaction
          else
            dep -f deploy/deploy.php deploy production --no-interaction
          fi

      - name: Rollback
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.action == 'rollback' }}
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST || '37.60.254.112' }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER || 'root' }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/var/www/freecause' }}
        run: dep -f deploy/deploy.php rollback production --no-interaction

      - name: Smoke test
        if: ${{ github.event_name == 'push' || inputs.action != 'rollback' }}
        run: |
          set -euo pipefail
          expected=$(git rev-parse --short HEAD)
          for i in 1 2 3 4 5 6; do
            body=$(curl -fsS --max-time 15 https://www.freecause.com/version || true)
            commit=$(printf '%s' "$body" | sed -n 's/.*"commit":"\([^"]*\)".*/\1/p')
            if [ "$commit" = "$expected" ]; then
              echo "version OK ($commit)"
              exit 0
            fi
            sleep 5
          done
          echo "version check failed (expected $expected, got '${commit:-none}')"
          exit 1

      - name: Roll back on failure
        if: ${{ failure() && (github.event_name == 'push' || inputs.action != 'rollback') }}
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST || '37.60.254.112' }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER || 'root' }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/var/www/freecause' }}
        run: dep -f deploy/deploy.php rollback production --no-interaction || true
