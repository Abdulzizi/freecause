name: Deploy

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Tag or branch to deploy (blank = current ref)'
        required: false
        default: ''
      action:
        description: 'Action'
        type: choice
        options:
          - deploy
          - rollback
        default: deploy

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  ci:
    if: ${{ github.event_name == 'push' || inputs.action == 'deploy' }}
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: [ci]
    if: ${{ always() && (needs.ci.result == 'success' || needs.ci.result == 'skipped') }}
    environment: production
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install JS dependencies
        run: npm ci --no-audit --no-fund

      - name: Build frontend assets
        if: ${{ github.event_name == 'push' || inputs.action != 'rollback' }}
        run: npm run build

      - name: Install Deployer
        run: |
          curl -fsSL -o deployer.phar https://github.com/deployphp/deployer/releases/download/v8.0.5/deployer.phar
          chmod +x deployer.phar
          sudo mv deployer.phar /usr/local/bin/dep

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf 'Host *\n  StrictHostKeyChecking accept-new\n  IdentityFile ~/.ssh/id_deploy\n  ServerAliveInterval 30\n  ServerAliveCountMax 20\n' > ~/.ssh/config

      - name: Deploy
        if: ${{ github.event_name == 'push' || inputs.action != 'rollback' }}
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST || '37.60.254.112' }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER || 'root' }}
          DEPLOY_PATH: /var/www/freecause
          TAG: ${{ inputs.ref || github.ref_name }}
        run: |
          set -euo pipefail
          if ! [[ "$TAG" =~ ^v[0-9] ]]; then
            echo "Refusing deploy: TAG must match ^v[0-9] (got '$TAG')"
            exit 1
          fi
          dep -f deploy/deploy.php deploy production --tag="$TAG" --no-interaction

      - name: Rollback
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.action == 'rollback' }}
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST || '37.60.254.112' }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER || 'root' }}
          DEPLOY_PATH: /var/www/freecause
        run: dep -f deploy/deploy.php rollback production --no-interaction

      - name: Smoke test (server-local)
        if: ${{ github.event_name == 'push' || inputs.action != 'rollback' }}
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST || '37.60.254.112' }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          SSH_ARGS="-i ~/.ssh/id_deploy -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20"
          expected=$(git rev-parse --short HEAD)
          for i in 1 2 3 4 5 6; do
            body=$(ssh $SSH_ARGS root@"$DEPLOY_HOST" "curl -sk --max-time 15 -H 'Host: www.freecause.com' https://127.0.0.1/version" || true)
            commit=$(printf '%s' "$body" | sed -n 's/.*"commit":"\([^"]*\)".*/\1/p')
            if [ "$commit" = "$expected" ]; then
              echo "version OK ($commit)"
              exit 0
            fi
            sleep 5
          done
          echo "version check failed (expected $expected, got '${commit:-none}')"
          exit 1

      - name: Roll back on failure
        if: ${{ failure() && (github.event_name == 'push' || inputs.action != 'rollback') }}
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST || '37.60.254.112' }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER || 'root' }}
          DEPLOY_PATH: /var/www/freecause
        run: dep -f deploy/deploy.php rollback production --no-interaction || true
