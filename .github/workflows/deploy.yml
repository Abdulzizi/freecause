name: Deploy on tag

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Tag or commit to deploy (rollback: use an older tag)'
        required: false
        default: ''

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  security-audit:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-scripts

      - name: Composer audit
        run: composer audit --locked

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Npm audit
        run: npm install --no-audit --no-fund && npm audit --audit-level=high

  deploy:
    needs: [ci]
    environment: production
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install JS dependencies
        run: npm install --no-audit --no-fund

      - name: Build frontend assets
        run: npm run build

      - name: Run deploy on server
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST || '37.60.254.112' }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/var/www/freecause-release-v2026.09.19' }}
          TAG: ${{ inputs.ref || github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          SSH_ARGS="-i ~/.ssh/id_deploy -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20"
          ssh $SSH_ARGS root@"$DEPLOY_HOST" \
            "cd $DEPLOY_PATH && \
             git fetch origin --tags && \
             git checkout $TAG && \
             COMPOSER_ALLOW_SUPERUSER=1 composer install --no-dev --no-interaction --optimize-autoloader && \
             rm -rf public/build && \
             php artisan config:clear && php artisan config:cache && \
             php artisan view:clear && php artisan view:cache && \
             php artisan route:clear && php artisan route:cache && \
             systemctl restart php8.3-fpm && \
             git log -1 --oneline && \
             echo DEPLOY_OK"
          scp $SSH_ARGS -r public/build root@"$DEPLOY_HOST":"$DEPLOY_PATH/public/"

      - name: Stamp deployed version
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST || '37.60.254.112' }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/var/www/freecause-release-v2026.09.19' }}
          TAG: ${{ inputs.ref || github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          SSH_ARGS="-i ~/.ssh/id_deploy -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20"
          ssh $SSH_ARGS root@"$DEPLOY_HOST" \
            "cd $DEPLOY_PATH && php artisan app:stamp-version '$TAG' --commit=\$(git rev-parse --short HEAD) || true"

      - name: Smoke test (server-local over SSH)
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST || '37.60.254.112' }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          SSH_ARGS="-i ~/.ssh/id_deploy -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20"
          for i in 1 2 3 4 5; do
            code=$(ssh $SSH_ARGS root@"$DEPLOY_HOST" \
              "curl -s -o /dev/null -w '%{http_code}' -k --max-time 15 \
               -H 'Host: www.freecause.com' https://127.0.0.1/up" || true)
            if [ "$code" = "200" ]; then
              echo "health OK (server-local /up: $code)"
              exit 0
            fi
            sleep 3
          done
          echo "health check failed (last: $code)"
          exit 1
