name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      ref:
        description: 'Commit, branch or tag on main to deploy (blank = current ref)'
        required: false
        default: ''
      action:
        description: 'Action'
        type: choice
        options:
          - deploy
          - rollback
        default: deploy

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  ci:
    if: ${{ github.event_name == 'push' || inputs.action == 'deploy' }}
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: [ci]
    if: ${{ always() && (needs.ci.result == 'success' || needs.ci.result == 'skipped') }}
    environment: production
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Resolve the target commit
        id: target
        env:
          REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          ref="$REF"
          if [ -z "$ref" ]; then
            sha='${{ github.sha }}'
          else
            sha=$(git rev-parse --verify "origin/${ref}^{commit}" 2>/dev/null || git rev-parse --verify "${ref}^{commit}")
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "target commit: $sha"

      - name: Guard the target
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          sha='${{ steps.target.outputs.sha }}'
          if [ '${{ github.event_name }}' = 'push' ]; then
            if [ '${{ github.ref }}' != 'refs/heads/main' ]; then
              echo "::error::refusing to deploy '${{ github.ref }}' — only main reaches production"
              exit 1
            fi
            echo "push to main: $sha"
            exit 0
          fi
          status=$(gh api "repos/${{ github.repository }}/compare/main...${sha}" --jq '.status' 2>/dev/null || echo unknown)
          case "$status" in
            identical|behind)
              echo "$sha is on main ($status)"
              ;;
            *)
              echo "::error::refusing to deploy $sha — it is not on main (compare status: $status)"
              exit 1
              ;;
          esac

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install JS dependencies
        run: npm ci --no-audit --no-fund

      - name: Build frontend assets
        if: ${{ github.event_name == 'push' || inputs.action != 'rollback' }}
        run: npm run build

      - name: Install Deployer
        run: |
          curl -fsSL -o deployer.phar https://github.com/deployphp/deployer/releases/download/v8.0.5/deployer.phar
          chmod +x deployer.phar
          sudo mv deployer.phar /usr/local/bin/dep

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf 'Host *\n  StrictHostKeyChecking accept-new\n  IdentityFile ~/.ssh/id_deploy\n  ServerAliveInterval 30\n  ServerAliveCountMax 20\n' > ~/.ssh/config

      - name: Report the server PHP version
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          MIN_PHP: '8.3.36'
        run: |
          set -uo pipefail
          version=$(ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 root@"$DEPLOY_HOST" 'php8.3 -r "echo PHP_VERSION;"' 2>/dev/null || echo unknown)
          echo "server PHP: $version (patched minimum: $MIN_PHP)"
          if [ "$version" != "unknown" ] && [ "$(printf '%s\n%s\n' "$version" "$MIN_PHP" | sort -V | head -1)" != "$MIN_PHP" ]; then
            echo "::warning::server PHP $version is below $MIN_PHP — vulnerable to php2shell (CVE-2026-109618 / CVE-2026-109619). Patch the host."
          fi

      - name: Record live release
        id: before
        if: ${{ github.event_name == 'push' || inputs.action != 'rollback' }}
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER || 'root' }}
          DEPLOY_PATH: /var/www/freecause
        run: |
          set -uo pipefail
          current=$(ssh -i ~/.ssh/id_deploy -o ConnectTimeout=20 "$DEPLOY_USER"@"$DEPLOY_HOST" "readlink $DEPLOY_PATH/current" 2>/dev/null || true)
          if [ -z "$current" ]; then
            echo "::warning::live release before deploy is unknown (first deploy or SSH failure), automatic rollback is disabled for this run"
          fi
          echo "live release before deploy: ${current:-unknown}"
          echo "current=$current" >> "$GITHUB_OUTPUT"

      - name: Deploy
        if: ${{ github.event_name == 'push' || inputs.action != 'rollback' }}
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER || 'root' }}
          DEPLOY_PATH: /var/www/freecause
          REVISION: ${{ steps.target.outputs.sha }}
        run: |
          set -euo pipefail
          dep -f deploy/deploy.php deploy production --revision="$REVISION" --no-interaction

      - name: Rollback
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.action == 'rollback' }}
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER || 'root' }}
          DEPLOY_PATH: /var/www/freecause
        run: dep -f deploy/deploy.php rollback production --no-interaction

      - name: Smoke test (server-local)
        if: ${{ github.event_name == 'push' || inputs.action != 'rollback' }}
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          EXPECTED: ${{ steps.target.outputs.sha }}
        run: |
          set -euo pipefail
          SSH_ARGS="-i ~/.ssh/id_deploy -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20"
          expected=$(git rev-parse --short "$EXPECTED")
          for i in 1 2 3 4 5 6; do
            body=$(ssh $SSH_ARGS root@"$DEPLOY_HOST" "curl -sk --max-time 15 -H 'Host: www.freecause.com' https://127.0.0.1/version" || true)
            commit=$(printf '%s' "$body" | sed -n 's/.*"commit":"\([^"]*\)".*/\1/p')
            home=$(ssh $SSH_ARGS root@"$DEPLOY_HOST" "curl -sk -o /dev/null -w '%{http_code}' --max-time 15 -H 'Host: www.freecause.com' https://127.0.0.1/en" || true)
            if [ "$commit" = "$expected" ] && [ "$home" = "200" ]; then
              echo "version OK ($commit), home page $home"
              exit 0
            fi
            sleep 5
          done
          echo "smoke check failed (expected $expected, got '${commit:-none}', home page '${home:-none}')"
          exit 1

      - name: Roll back on failure
        if: ${{ failure() && (github.event_name == 'push' || inputs.action != 'rollback') }}
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER || 'root' }}
          DEPLOY_PATH: /var/www/freecause
          BEFORE: ${{ steps.before.outputs.current }}
        run: |
          set -uo pipefail
          if [ -z "$BEFORE" ]; then
            echo "::warning::live release before deploy is unknown, skipping rollback"
            exit 0
          fi
          now=""
          for i in 1 2 3; do
            now=$(ssh -i ~/.ssh/id_deploy -o ConnectTimeout=20 "$DEPLOY_USER"@"$DEPLOY_HOST" "readlink $DEPLOY_PATH/current" 2>/dev/null || true)
            [ -n "$now" ] && break
            sleep 5
          done
          if [ -z "$now" ]; then
            echo "::error::cannot read the live release after 3 tries, rollback skipped, check production by hand"
            exit 0
          fi
          if [ "$now" = "$BEFORE" ]; then
            echo "new release never went live, nothing to roll back"
            exit 0
          fi
          dep -f deploy/deploy.php rollback production --no-interaction || echo "::error::rollback failed, manual action needed"
