[program:freecause-release-scheduler]
process_name=%(program_name)s
command=php /var/www/freecause/current/artisan schedule:work
directory=/var/www/freecause/current
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/freecause/current/storage/logs/scheduler.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stopwaitsecs=120
