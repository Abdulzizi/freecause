name: CI

on:
  pull_request:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: dom, gd, mbstring, fileinfo, zip, exif, sqlite3, pdo_sqlite
          coverage: none

      - name: Validate composer manifest
        run: composer validate --no-check-publish --no-interaction

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress --no-scripts

      - name: Run test suite
        run: php artisan test

      - name: Check code style
        run: ./vendor/bin/pint --test app database tests routes config

      - name: Design system lint
        run: bash scripts/ds-lint.sh

  assets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install JS dependencies
        run: npm ci --no-audit --no-fund

      - name: Run JavaScript unit tests
        run: node --test tests/js/*.test.cjs

      - name: Build frontend assets
        run: npm run build

  e2e:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: dom, gd, mbstring, fileinfo, zip, exif, sqlite3, pdo_sqlite
          coverage: none

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress --no-scripts

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install JS dependencies
        run: npm ci --no-audit --no-fund

      - name: Build frontend assets
        run: npm run build

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium
        timeout-minutes: 5
        run: npx playwright install --with-deps chromium

      - name: Install sqlite3 CLI (e2e specs read tokens from the DB)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sqlite3

      - name: Run browser tests
        run: npx playwright test

      - name: Run screenshot tests
        run: bash scripts/e2e-visual.sh

      - name: Upload failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results
          retention-days: 7

  security-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-scripts

      - name: Composer audit
        run: |
          set -uo pipefail
          out=$(composer audit --locked 2>&1) && { echo "$out"; exit 0; }
          echo "$out"
          if echo "$out" | grep -qiE "audit endpoint|503|Service Unavailable|Connection timed out|network"; then
            echo "::warning::composer audit could not reach the advisory service (infrastructure error, not a finding)"
            exit 0
          fi
          exit 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Npm audit
        run: |
          set -uo pipefail
          npm ci --no-audit --no-fund
          for attempt in 1 2 3; do
            out=$(npm audit --audit-level=high 2>&1) && { echo "$out"; exit 0; }
            echo "$out"
            if echo "$out" | grep -qiE "audit endpoint returned an error|503|Service Unavailable|ECONNRESET|ETIMEDOUT"; then
              echo "::warning::npm audit endpoint unavailable (attempt $attempt/3) — not a finding"
              sleep 20
              continue
            fi
            exit 1
          done
          echo "::warning::npm audit service unreachable after 3 attempts — continuing (findings are not knowable right now)"
          exit 0
