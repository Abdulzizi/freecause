name: Deploy on tag

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Tag or commit to deploy (rollback: use an older tag)'
        required: false
        default: ''

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install JS dependencies
        run: npm install

      - name: Build frontend assets
        run: npm run build

      - name: Run deploy on server
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST || '37.60.254.112' }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/var/www/freecause-release-v2026.09.19' }}
          TAG: ${{ inputs.ref || github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          SSH_ARGS="-i ~/.ssh/id_deploy -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20"
          ssh $SSH_ARGS root@"$DEPLOY_HOST" \
            "cd $DEPLOY_PATH && \
             git fetch origin --tags && \
             git checkout $TAG && \
             rm -rf public/build && \
             php artisan config:clear && php artisan config:cache && \
             php artisan view:clear && php artisan view:cache && \
             php artisan route:clear && php artisan route:cache && \
             systemctl reload php8.3-fpm && \
             git log -1 --oneline && \
             echo DEPLOY_OK"
          scp $SSH_ARGS -r public/build root@"$DEPLOY_HOST":"$DEPLOY_PATH/public/"

      - name: Smoke test
        env:
          HEALTH_URL: ${{ vars.HEALTH_URL || 'https://preview.freecause.com/' }}
        run: |
          for i in 1 2 3 4 5; do
            code=$(curl -sL --max-redirs 5 -o /dev/null -w '%{http_code}' "$HEALTH_URL" || true)
            if [ "$code" = "200" ]; then
              echo "health OK ($code)"
              exit 0
            fi
            sleep 3
          done
          echo "health check failed (last: $code)"
          exit 1