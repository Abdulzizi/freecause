name: CI

on:
  push:
    branches-ignore:
      - main
  pull_request:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: dom, gd, mbstring, fileinfo, zip, exif, sqlite3, pdo_sqlite
          coverage: none

      - name: Validate composer manifest
        run: composer validate --no-check-publish --no-interaction

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress --no-scripts

      - name: Run test suite
        run: php artisan test

      - name: Check code style
        run: ./vendor/bin/pint --test app database tests routes config

      - name: Design system lint
        run: bash scripts/ds-lint.sh

  assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install JS dependencies
        run: npm ci --no-audit --no-fund

      - name: Run JavaScript unit tests
        run: node --test tests/js/*.test.cjs

      - name: Build frontend assets
        run: npm run build

  security-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-scripts

      - name: Composer audit
        run: composer audit --locked

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Npm audit
        run: npm ci --no-audit --no-fund && npm audit --audit-level=high
