name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish a release for'
        required: true
        default: ''

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve the tag
        id: tag
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          tag="$TAG"
          if ! [[ "$tag" =~ ^v[0-9] ]]; then
            echo "::error::refusing to release '$tag' — a version tag must look like vYYYY.MM.DD-HHMMSS"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "releasing $tag"

      - name: Collect the changelog section
        id: notes
        run: |
          set -euo pipefail
          tag='${{ steps.tag.outputs.tag }}'
          notes=$(mktemp)
          if [ -f CHANGELOG.md ]; then
            awk -v tag="$tag" '
              $0 ~ "^## \\[" tag "\\]" { found = 1; next }
              found && /^## \[/ { exit }
              found { print }
            ' CHANGELOG.md > "$notes"
          fi
          if [ ! -s "$notes" ]; then
            echo "no CHANGELOG.md section for $tag — falling back to generated notes"
            printf '' > "$notes"
          fi
          echo "notes=$notes" >> "$GITHUB_OUTPUT"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
          NOTES: ${{ steps.notes.outputs.notes }}
        run: |
          set -euo pipefail
          if [ -s "$NOTES" ]; then
            gh release create "$TAG" --title "$TAG" --notes-file "$NOTES" --verify-tag
          else
            gh release create "$TAG" --title "$TAG" --generate-notes --verify-tag
          fi

      - name: Update the release if it already exists
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
          NOTES: ${{ steps.notes.outputs.notes }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            if [ -s "$NOTES" ]; then
              gh release edit "$TAG" --notes-file "$NOTES"
            else
              echo "release $TAG already exists — nothing to update"
            fi
          fi
