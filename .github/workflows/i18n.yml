name: i18n parity

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lang-parity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      - name: Run lang parity audit
        run: php scripts/lang-audit.php